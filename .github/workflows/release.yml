name: Release

# Runs only when a version tag (v1.2.3, v1.2.3-rc.1) is pushed:
#   verify          the tag equals v + package.json version and its commit
#                   is on main
#   ci              the whole CI workflow (ci.yml) on the tag commit, so a
#                   release passes every gate main passes
#   build           the npm tarball, a CycloneDX SBOM of its runtime tree
#                   and SHA256SUMS over both (scripts/release-assets.sh)
#   github-release  build provenance attestation (public repository) and
#                   a new GitHub release; an existing release is never
#                   overwritten
#   npm-publish     publishes the tarball from the build job; stays off
#                   until the repository variable NPM_PUBLISH_ENABLED is
#                   'true' and npm trusted publishing (OIDC) is configured
#                   for this repository and workflow on npmjs.com
#   mcp-registry    lists the release in the official MCP Registry
#                   (mcp-registry.yml, GitHub OIDC); stable versions only;
#                   runs only after npm-publish succeeded, because the
#                   registry entry is the npm package
# Maintainer steps: docs/maintainers/release.md; repository settings:
# docs/maintainers/repo-settings.md.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All branches, so the tag commit can be checked against main.
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must match package.json version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Tag commit must be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag commit $GITHUB_SHA is not on main. Release only commits that are on main."
            exit 1
          fi

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: [verify, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      # npm pack (prepack: clean + build, prebuild: lint, typecheck, unit
      # tests), the SBOM of the runtime tree and SHA256SUMS in release/.
      - name: Tarball, SBOM and checksums
        run: bash scripts/release-assets.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release/
          if-no-files-found: error

  github-release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release
      - name: Build provenance attestation
        # Artifact attestations need a public repository (or GitHub
        # Enterprise Cloud); skipped while the repository is private.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tgz
            release/*.cdx.json
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          # A published asset is never replaced: its checksum and
          # attestation may already be in use. Delete the release by
          # hand and push a new tag instead.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; assets are not overwritten."
            exit 1
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" release/*.tgz release/*.cdx.json \
            release/SHA256SUMS --verify-tag --title "$TAG" --generate-notes "${flags[@]}"

  npm-publish:
    needs: [verify, build, github-release]
    # Off until the owner sets the repository variable
    # NPM_PUBLISH_ENABLED=true and configures trusted publishing on npm.
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout and no install: this job holds id-token: write, so
      # it runs no dependency code. It publishes the tarball the build
      # job packed, the same bytes as the GitHub release asset.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: npm must support trusted publishing (11.5.1 or newer)
        run: |
          node -e "
          const [a, b, c] = process.argv[1].split('.').map(Number);
          if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
            console.error('npm ' + process.argv[1] + ' is too old for trusted publishing');
            process.exit(1);
          }" "$(npm --version)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release
      - name: Tarball must match SHA256SUMS
        working-directory: release
        run: grep '\.tgz$' SHA256SUMS | sha256sum --check --strict
      - name: Publish
        env:
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          tag=latest
          if [ "$PRERELEASE" = "true" ]; then tag=next; fi
          # Trusted publishing (OIDC) needs no token and attaches
          # provenance. The leading ./ is required: without it npm reads
          # release/x.tgz as a GitHub owner/repo shorthand.
          npm publish ./release/the-real-snipeit-mcp-*.tgz --provenance --access public --tag "$tag"

  mcp-registry:
    needs: [verify, npm-publish]
    # Registry versions are permanent and the newest one is listed as
    # latest, so prereleases stay out. The registry entry is the npm
    # package and the registry checks that npm serves it, so this runs
    # only when npm-publish succeeded (a skipped or failed npm-publish
    # skips it).
    if: ${{ needs.verify.outputs.prerelease != 'true' }}
    uses: ./.github/workflows/mcp-registry.yml
    permissions:
      contents: read
      id-token: write
    with:
      tag: ${{ github.ref_name }}
